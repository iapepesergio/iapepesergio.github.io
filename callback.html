<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Authorization - Pildoras de la Historia</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.6; max-width: 720px; margin: 0 auto; padding: 32px 16px; color: #1f2933; }
    h1 { font-size: 1.6rem; }
    textarea { width: 100%; height: 110px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.9rem; padding: 8px; box-sizing: border-box; }
    button { padding: 8px 16px; font-size: 1rem; cursor: pointer; }
    .note { color: #52606d; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Authorization completed</h1>
  <p id="msg">Reading the authorization response&hellip;</p>
  <textarea id="code" readonly style="display:none"></textarea>
  <p><button id="copy" style="display:none">Copy code</button></p>
  <p class="note">This page is part of a personal tool by Pildoras de la Historia. The code shown here is private: do not share it.</p>
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      var msg = document.getElementById('msg');
      var box = document.getElementById('code');
      var btn = document.getElementById('copy');
      if (p.get('error')) {
        msg.textContent = 'Authorization failed: ' + p.get('error') + (p.get('error_description') ? ' - ' + p.get('error_description') : '');
        return;
      }
      var code = p.get('code');
      if (!code) {
        msg.textContent = 'No authorization code found in this URL.';
        return;
      }
      msg.textContent = 'Copy this code and paste it into your Apps Script project. It expires in a few minutes.';
      box.value = code;
      box.style.display = 'block';
      btn.style.display = 'inline-block';
      btn.onclick = function () {
        box.select();
        document.execCommand('copy');
        btn.textContent = 'Copied';
      };
      // Remove the code from the address bar and history
      if (window.history && history.replaceState) {
        history.replaceState(null, '', window.location.pathname);
      }
    })();
  </script>
</body>
</html>
